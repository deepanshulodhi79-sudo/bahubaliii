<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail Mail Sender</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-2xl">
    <h1 class="text-2xl font-bold text-slate-800">Gmail Mail Sender</h1>
    <p class="text-slate-500 text-sm mb-6">Send emails using your authenticated Gmail account.</p>

    <form id="mailForm" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Sender Name</label>
          <input type="text" id="senderName" placeholder="Your Name" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-slate-800 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Gmail Address</label>
          <input type="email" id="email" placeholder="youname@gmail.com" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-slate-800 outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Gmail App Password</label>
        <input type="password" id="appPassword" placeholder="Enter 16-character App Password" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-slate-800 outline-none">
        <p class="text-xs text-slate-400 mt-1">Use a Gmail App Password. Do not use your normal Gmail password.</p>
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-semibold text-slate-700">Recipients</label>
          <span class="text-xs text-slate-400">One email per line</span>
        </div>
        <textarea id="recipients" rows="3" required placeholder="recipient1@example.com
recipient2@example.com" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-slate-800 outline-none"></textarea>
        <p class="text-xs text-slate-400 mt-1">Maximum 50 recipients per request.</p>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Subject</label>
        <input type="text" id="subject" placeholder="Email subject" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-slate-800 outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Main Message</label>
        <textarea id="message" rows="4" required placeholder="Write your email message here..." class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-slate-800 outline-none"></textarea>
      </div>

      <div id="statusBox" class="hidden p-3 rounded-lg text-sm bg-green-100 text-green-800"></div>

      <div class="flex justify-end gap-3 pt-2">
        <button type="button" onclick="document.getElementById('mailForm').reset(); document.getElementById('statusBox').classList.add('hidden');" class="px-5 py-2 rounded-lg bg-slate-100 text-slate-700 text-sm font-semibold hover:bg-slate-200">Clear</button>
        <button type="submit" id="sendBtn" class="px-5 py-2 rounded-lg bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800">Send Email</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('mailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const sendBtn = document.getElementById('sendBtn');
      const statusBox = document.getElementById('statusBox');

      sendBtn.innerText = 'Sending...';
      sendBtn.disabled = true;

      const data = {
        senderName: document.getElementById('senderName').value,
        email: document.getElementById('email').value,
        appPassword: document.getElementById('appPassword').value,
        recipients: document.getElementById('recipients').value,
        subject: document.getElementById('subject').value,
        message: document.getElementById('message').value
      };

      try {
        const res = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();

        statusBox.classList.remove('hidden');
        if (res.ok) {
          statusBox.className = "p-3 rounded-lg text-sm bg-green-100 text-green-800";
          statusBox.innerText = result.message;
        } else {
          statusBox.className = "p-3 rounded-lg text-sm bg-red-100 text-red-800";
          statusBox.innerText = result.error || 'Failed to send emails.';
        }
      } catch (err) {
        statusBox.classList.remove('hidden');
        statusBox.className = "p-3 rounded-lg text-sm bg-red-100 text-red-800";
        statusBox.innerText = 'Something went wrong!';
      }

      sendBtn.innerText = 'Send Email';
      sendBtn.disabled = false;
    });
  </script>
</body>
</html>
